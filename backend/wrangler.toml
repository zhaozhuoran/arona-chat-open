name = "arona-chat"
main = "src/index.ts"
compatibility_date = "2026-04-11"

[[d1_databases]]
binding = "D1_DB"
database_name = "arona-chat-db"
database_id = "your-d1-database-id"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "arona-chat-r2"

[durable_objects]
bindings = [
  { name = "CHAT_SESSION_DO", class_name = "ChatSessionDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = [
  "ChatSessionDurableObject"
]

# Keep observability off by default in the public template.
[observability]
[observability.logs]
enabled = false
invocation_logs = false

[observability.traces]

# Environment variables for development, do not remove or change these
# WARNING: DO NOT REMOVE OR CHANGE
[vars]
# Public defaults.
API_ENDPOINT = "https://openrouter.ai/api/v1/chat/completions"
BRAVE_SEARCH_API_ENDPOINT = "https://api.search.brave.com/res/v1/web/search"

# Set these in Cloudflare secrets or copy backend/.dev.vars.example to backend/.dev.vars.
# AI_API_KEY = ""
# BRAVE_SEARCH_API_TOKEN = ""
# R2_ACCESS_KEY_ID = ""
# R2_SECRET_ACCESS_KEY = ""
# R2_ENDPOINT = "https://<account-id>.r2.cloudflarestorage.com"
# AUTH_PASSWORD = ""
# AUTH_TOKEN_SECRET = ""
# CLERK_SECRET_KEY = ""
# CLERK_PUBLISHABLE_KEY = ""
# USERS_ADMIN_EMAILS = ""
R2_PUBLIC_BASE_URL = ""
R2_PROXY_DOMAIN = ""
USERS_ADMIN_EMAILS = ""
DEV_ADMIN_SHARE_CHAT = ""
ENABLE_WHITELIST = ""

# Routes for R2
[[routes]]
pattern = ""
custom_domain = true

# Routes for API
[[routes]]
pattern = ""
custom_domain = true

[build]
command = "npm run build"
